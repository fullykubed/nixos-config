# Vulnix CVE Whitelist
# ====================
#
# WHITELIST KEY FORMAT:
#   ["package"]         - Version-agnostic: use for FALSE POSITIVES (name collisions)
#   ["package-1.2.3"]   - Version-specific: use for ACCEPTED RISK & BUNDLED DEPS
#
# WHY VERSION MATTERS:
#   - False positives: CVEs affect DIFFERENT software with same name. Any version
#     of our package is unaffected, so version-agnostic is correct.
#   - Accepted risk: CVEs are REAL but we accept them. Version-specific ensures
#     we're notified when package updates (fix may be available).
#   - Bundled deps: Old library versions inside packages. Version-specific ensures
#     we review when top-level package updates.
#
# ORGANIZATION: Entries organized by category and top-level package.
# When a package updates, search for its name and review/remove its CVEs.
#
# TOML LIMITATION: Cannot have duplicate pname keys. When multiple packages
# pull in the same vulnerable dep, all CVEs go in one entry with comments
# showing which top-level package is responsible for which CVEs.


################################################################################
#                                                                              #
#                        FALSE POSITIVES - BY TYPE                             #
#                                                                              #
################################################################################
# These are NOT real vulnerabilities - the CVEs affect different software
# that happens to share a name with packages in our system.


